[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
fuzz = { runs = 512 }
invariant = { runs = 256, depth = 64, fail_on_revert = false }

[profile.ci]
fuzz = { runs = 2000 }
invariant = { runs = 1000, depth = 100, fail_on_revert = false }
